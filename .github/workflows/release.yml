name: Release

# Runs when a version tag such as v0.1.0 is pushed: builds the plugin zip,
# attaches it and a plugins.xml (a plugin repository QGIS can read) to a
# GitHub release, and publishes it to plugins.qgis.org once the
# QGIS_PLUGIN_TOKEN secret is set.
#
# plugins.qgis.org: the first version is uploaded by hand through its web
# form (https://plugins.qgis.org/plugins/add/), which creates the plugin.
# After that, the plugin's page there has a "Tokens" tab: make a token and
# save it as the repository secret QGIS_PLUGIN_TOKEN. Every tag then
# uploads the new version. (OSGEO_USERNAME / OSGEO_PASSWORD still work as
# the older way in.)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release=(qgis-plugin-ci release "$version" --release-tag "$GITHUB_REF_NAME"
                   --github-token "$GITHUB_TOKEN" --create-plugin-repo)
          if [ -n "$QGIS_PLUGIN_TOKEN" ]; then
            "${release[@]}" --qgis-token "$QGIS_PLUGIN_TOKEN"
          elif [ -n "$OSGEO_USERNAME" ]; then
            "${release[@]}" --osgeo-username "$OSGEO_USERNAME" --osgeo-password "$OSGEO_PASSWORD"
          else
            echo "No plugins.qgis.org token set: attaching the zip to the GitHub release only."
            "${release[@]}"
          fi
