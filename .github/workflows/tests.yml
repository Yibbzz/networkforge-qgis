name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # a "Run workflow" button on the Actions page

jobs:
  test:
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The long-term release most people run, and the newest QGIS.
        qgis: [ltr, latest]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: |
          qgis_process --version || true
          python3 --version

      - name: Install test tools
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install -r requirements-dev.txt

      # Includes the end-to-end tests: they install the pinned engine the
      # same way the plugin does for users, then build from tests/data.
      - name: Run tests
        run: python3 -m pytest -v --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: python3 -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: matrix.qgis == 'ltr'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # What plugins.qgis.org checks on upload, so a version it would block
  # fails here first: bandit, detect-secrets and flake8's critical rules
  # (they block), and the Qt6 check (warnings on the plugin's page).
  plugin-checks:
    name: plugins.qgis.org checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit detect-secrets flake8
      - run: scripts/plugin_checks.sh

  qt6:
    name: Qt6 check
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/qt6_check.sh

  # Most users are on Windows, where the engine install is the part most
  # likely to differ. QGIS is installed from the same installer they use
  # (qgis.org's, fetched by Chocolatey) and the tests run in its Python.
  # tests/test_qgis_process.py is the one closest to a new user: QGIS
  # loads the plugin from a new profile folder and the first tool run
  # fetches uv, installs the engine and builds a network.
  windows:
    name: Windows, QGIS ltr
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install QGIS
        run: choco install qgis-ltr -y --no-progress

      - name: Find QGIS
        run: |
          $bin = (Get-Item "C:\Program Files\QGIS*\bin" | Select-Object -First 1).FullName
          if (-not $bin) { throw "QGIS is not in C:\Program Files" }
          $python = (Get-Item "$bin\python-qgis*.bat" | Select-Object -First 1).FullName
          $process = (Get-Item "$bin\qgis_process-qgis*.bat" | Select-Object -First 1).FullName
          if (-not $python -or -not $process) {
            Get-ChildItem $bin -Filter *.bat
            throw "python-qgis*.bat or qgis_process-qgis*.bat is missing from $bin"
          }
          Write-Host "QGIS's Python: $python"
          Write-Host "qgis_process:  $process"
          Add-Content -Path $env:GITHUB_ENV -Value "QGIS_PYTHON=$python"
          Add-Content -Path $env:GITHUB_ENV -Value "NF_QGIS_PROCESS=$process"

      - name: Install test tools
        run: '& $env:QGIS_PYTHON -m pip install -r requirements-dev.txt'

      - name: Run tests
        env:
          # The engine goes into a folder with a space and an accent,
          # like the profile folder of a user called Zoë Müller.
          NF_TEST_ENGINE_DIR: ${{ runner.temp }}\Zoë Müller\networkforge
        run: >
          & $env:QGIS_PYTHON -m pytest -v
          --ignore=tests/test_network_analyst.py
          --ignore=tests/test_easy_r5.py
          --basetemp="$env:RUNNER_TEMP\pytest"

      # A step of its own, so that a red job shows at a glance whether
      # it is the plugin or the routing that failed on Windows.
      - name: Route on the PBF files with the Network Analyst plugin
        if: ${{ !cancelled() }}
        env:
          NF_TEST_ENGINE_DIR: ${{ runner.temp }}\Zoë Müller\networkforge
        run: >
          & $env:QGIS_PYTHON -m pytest -v -s
          tests/test_network_analyst.py
          --basetemp="$env:RUNNER_TEMP\pytest-routing"

      # Esri's public transit tutorial with the Easy-R5 plugin (R5, Java).
      - name: Public transit with the Easy-R5 plugin
        if: ${{ !cancelled() }}
        env:
          NF_TEST_ENGINE_DIR: ${{ runner.temp }}\Zoë Müller\networkforge
        run: >
          & $env:QGIS_PYTHON -m pytest -v -s
          tests/test_easy_r5.py
          --basetemp="$env:RUNNER_TEMP\pytest-transit"

      # engine.log has what uv and the engine printed.
      - name: Keep the engine logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            ${{ runner.temp }}/**/engine.log
            ${{ runner.temp }}/**/valhalla_service.log
          if-no-files-found: ignore

  # macOS, with qgis.org's own LTR installer (Homebrew's qgis@ltr cask
  # fetches it), on Apple silicon: the engine install takes uv's
  # aarch64-apple-darwin build. The same tests as on Windows; the
  # routing and transit ones are left to Linux and Windows.
  macos:
    name: macOS, QGIS ltr
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install QGIS
        run: brew install --cask qgis@ltr

      - name: Find QGIS
        run: |
          app=$(ls -d /Applications/QGIS*.app | head -1)
          [ -n "$app" ] || { echo "QGIS is not in /Applications"; exit 1; }
          python=$(find "$app/Contents" -type f -perm -u+x \( -name python3 -o -name 'python3.[0-9]*' \) | grep -v '\-config' | head -1)
          process=$(find "$app/Contents" -type f -perm -u+x -name qgis_process | head -1)
          echo "QGIS:          $app"
          echo "QGIS's Python: $python"
          echo "qgis_process:  $process"
          [ -n "$python" ] && [ -n "$process" ] || { find "$app/Contents/MacOS" -maxdepth 2 | head -50; exit 1; }
          # Started outside the app, its Python doesn't know where its
          # standard library is (QGIS tells it when the app runs): it is
          # in Contents/Resources/python3.x, with QGIS's modules in
          # site-packages there.
          encodings=$(find "$app/Contents" -path '*/python3*/encodings/__init__.py' -not -path '*/site-packages/*' | head -1)
          qgis_pkg=$(find "$app/Contents" -path '*/site-packages/qgis/core/__init__.py' | head -1)
          echo "encodings:     $encodings"
          echo "qgis package:  $qgis_pkg"
          if [ -z "$encodings" ] || [ -z "$qgis_pkg" ]; then
            find "$app" -name encodings -maxdepth 8 | head
            exit 1
          fi
          stdlib=$(dirname "$(dirname "$encodings")")
          modules=$(dirname "$(dirname "$(dirname "$qgis_pkg")")")
          path="$stdlib:$stdlib/lib-dynload:$modules"
          echo "QGIS_PYTHON=$python" >> "$GITHUB_ENV"
          echo "NF_QGIS_PROCESS=$process" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$path" >> "$GITHUB_ENV"
          export PYTHONPATH="$path"
          "$python" -c "import sys, qgis.core; print('QGIS', qgis.core.Qgis.version(), sys.version)"

      - name: Install test tools
        run: '"$QGIS_PYTHON" -m pip install -r requirements-dev.txt'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # A space and an accent, like a user called Zoë Müller.
          NF_TEST_ENGINE_DIR: ${{ runner.temp }}/Zoë Müller/networkforge
          # QGIS's Python can't run the tests' stand-in engine without
          # PYTHONPATH, which the plugin clears for the engine.
          NF_TEST_FAKE_PYTHON: /usr/bin/python3
        run: >
          "$QGIS_PYTHON" -m pytest -v
          --ignore=tests/test_network_analyst.py
          --ignore=tests/test_easy_r5.py
          --basetemp="$RUNNER_TEMP/pytest"

      - name: Keep the engine logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: ${{ runner.temp }}/**/engine.log
          if-no-files-found: ignore

  # Optional: add a CODECOV_TOKEN repo secret (codecov.io, free for
  # public repos) to get coverage history and the README badge. Done in
  # its own job because the QGIS image lacks what the uploader needs.
  coverage:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.CODECOV_TOKEN != ''

      - uses: actions/download-artifact@v4
        if: env.CODECOV_TOKEN != ''
        with:
          name: coverage

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
