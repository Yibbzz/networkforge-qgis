name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The long-term release most people run, and the newest QGIS.
        qgis: [ltr, latest]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          qgis_process --version || true
          python3 --version

      - name: Install test tools
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install -r requirements-dev.txt

      # Includes the end-to-end tests: they install the pinned engine the
      # same way the plugin does for users, then build from tests/data.
      - name: Run tests
        run: python3 -m pytest -v
