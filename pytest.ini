[pytest]
testpaths = tests
pythonpath = .
markers =
    engine: needs the real NetworkForge engine (installs it on first run; slow)
    network_analyst: routes on the PBF files with the Network Analyst plugin and Valhalla (downloads both on first run; needs port 8002)
    easy_r5: builds R5 networks from the PBF files with the Easy-R5 plugin and works out trip times (downloads Easy-R5, Java and R5 on first run; QGIS 3 only)
